on:   #eseguita quando pusha sul branch master
  push:
    branches: [master]

permissions:
  contents: read  #diamo alla pipeline l'autorizzazione di leggere i contenuti
  pages: write
  id-token: write


jobs: 
  deploy: 
    runs-on: ubuntu-latest
    environment: 
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4